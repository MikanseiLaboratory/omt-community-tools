name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - name: Install Linux audio/windowing deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: Clippy (workspace libs/tools)
        run: cargo clippy -p suite-core -p omt-media -p pattern-generator -p monitor-bench -p omt-studio-monitor -p omt-test-patterns -p omt-config-manager -p omt-discovery-server --all-targets -- -D warnings
      - name: Test
        run: cargo test -p suite-core -p omt-media -p pattern-generator -p monitor-bench -p omt-config-manager -p omt-discovery-server

  build-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: bash ./scripts/ci/install-linux-deps.sh tools
      - name: Build release tools
        run: cargo build --release --target ${{ matrix.target }} -p omt-studio-monitor -p omt-test-patterns -p omt-config-manager -p omt-discovery-server
      - name: Upload tool artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tools-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/omt-studio-monitor*
            target/${{ matrix.target }}/release/omt-test-patterns*
            target/${{ matrix.target }}/release/omt-config-manager*
            target/${{ matrix.target }}/release/omt-discovery-server*

  build-windows-arm64:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: aarch64-pc-windows-msvc
      - name: Build Windows Arm64 tools
        run: cargo build --release --target aarch64-pc-windows-msvc -p omt-studio-monitor -p omt-test-patterns -p omt-config-manager -p omt-discovery-server
      - name: Upload tool artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: tools-aarch64-pc-windows-msvc
          path: |
            target/aarch64-pc-windows-msvc/release/omt-studio-monitor*
            target/aarch64-pc-windows-msvc/release/omt-test-patterns*
            target/aarch64-pc-windows-msvc/release/omt-config-manager*
            target/aarch64-pc-windows-msvc/release/omt-discovery-server*

  launcher-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"
      - name: Ensure sidecar placeholders
        shell: pwsh
        run: ./scripts/ensure-sidecar-placeholders.ps1
      - name: Check launcher crate
        run: cargo check -p omt-launcher
      - name: Install frontend deps
        working-directory: apps/launcher
        run: bun install --frozen-lockfile
      - name: Typecheck frontend
        working-directory: apps/launcher
        run: bunx tsc --noEmit
